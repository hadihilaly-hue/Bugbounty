# Allowlist — the ONLY thing that authorizes the harness against a host.
# A target runs only if it is listed here with a safe_harbor_url and in_scope
# assets. Anything not matched by an in_scope entry is skipped (fail closed).
# `dry_run: true` stays until you explicitly clear a target for active payloads.
targets:
  # Target #0 — local, deliberately-vulnerable practice app. Safe to run fully.
  - name: "OWASP Juice Shop (local sandbox)"
    platform: "self"
    safe_harbor_url: "https://owasp.org/www-project-juice-shop/"
    ai_policy: "assisted_ok"
    pays_cash: false
    in_scope:
      - "localhost"
      - "127.0.0.1"
    out_of_scope: []
    auth:
      multi_account: true
      creds_ref: "secrets/juiceshop.yaml"
    notes: "Ground-truth target for the pipeline. Local only."
    dry_run: false

  # Target #1 — local DVWA: CSRF-protected cookie-session practice target.
  - name: "DVWA (local sandbox)"
    platform: "self"
    safe_harbor_url: "https://github.com/digininja/DVWA"
    ai_policy: "assisted_ok"
    pays_cash: false
    in_scope:
      - "localhost"
      - "127.0.0.1"
    out_of_scope: []
    auth:
      multi_account: false
      creds_ref: "secrets/dvwa.yaml"
      login:
        mode: "form"
        url: "http://localhost:4280/login.php"
        csrf_field: "user_token"        # DVWA's anti-CSRF hidden field
        user_field: "username"
        pass_field: "password"
        extra_fields: {Login: "Login"}
        success_url: "http://localhost:4280/index.php"
        success_marker: "Logout"        # present only when authenticated
        expiry_marker: "Login :: Damn Vulnerable Web Application"
    notes: "Local CSRF+cookie-session practice target (admin/password). Local only."
    dry_run: false

  # Example real-program entry (commented; you paste in programs you choose).
  # - name: "Example Program"
  #   platform: "hackerone"
