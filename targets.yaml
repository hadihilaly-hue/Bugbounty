  # Target #2 — first REAL authorized program (HackerOne VDP). dry_run stays true
  # until a first pass is reviewed. BEFORE any run you must: (1) put your actual
  # HackerOne username in required_headers.X-HackerOne-Research (the harness
  # refuses to send traffic while it is the placeholder), and (2) create the
  # gitignored secrets/nebius.yaml with two accounts you own (handed-in sessions).
  - name: "Nebius AI VDP"
    platform: "hackerone"
    safe_harbor_url: "https://hackerone.com/nebius_ai_vdp"
    ai_policy: "assisted_ok"       # no AI ban in policy; workflow is human-verified
    pays_cash: false               # VDP, no reward
    in_scope:
      - "console.nebius.com"        # GA services only
      - "console.eu.nebius.com"     # GA services only
      - "tokenfactory.nebius.com"
      - "auth.tokenfactory.nebius.com"
      - "api.tokenfactory.nebius.com"
      - "auth.nebius.com"
      - "sts.nebius.com"
      - "api.nebius.cloud"          # GA services only
      - "nebius.com"
      - "dev.nebius.com"            # dev.nebius.com itself is IN scope
      - "docs.tokenfactory.nebius.com"
      - "docs.nebius.com"
      - "careers.nebius.com"
      - "status.nebius.com"
      - "static.nebius.com"
      - "assets.nebius.com"
    out_of_scope:
      # subdomain exclusions for the tokenfactory/auth/console/api.nebius.cloud assets
      - "testing.*"
      - "staging.*"
      - "preprod.*"
      - "beta.*"
      - "gamma.*"
      - "omega.*"
      - "sandbox.*"
      - "preview.*"
      - "trunk.*"
    required_headers:
      X-HackerOne-Research: "YOUR_H1_USERNAME"   # <- replace with your HackerOne username
    auth:
      multi_account: true
      creds_ref: "secrets/nebius.yaml"   # gitignored; two accounts YOU own
      mode: "manual"                      # hand in live session tokens from a real browser
    rate_limit:
      per_host_rps: 1      # conservative; policy states none, so be polite
    notes: "GA services only on console/api. One vuln per report. Do not discuss findings publicly without Nebius consent. Focus: cross-account IDOR/BOLA on the multi-tenant console."
    dry_run: true          # stays true until first pass reviewed
